services:
  # Backend Web Service
  - type: web
    name: church-app-backend
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    buildFilter:
      paths:
        - backend/**
        - shared/**
        - specs/**
        - package.json
        - package-lock.json
        - render.yaml
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: SENTRY_ENABLED
        value: "true"
      - key: SENTRY_DSN
        sync: false # Paste backend DSN from sentry.io/settings/khcabz/projects/church-app-backend/keys/
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://www.singburisdacenter.org,https://singburisdacenter.org,https://singburisdacenter.vercel.app,https://singburiadventistcenter.vercel.app
      - key: DATABASE_URL
        sync: false # Set to Neon POOLER connection string (e.g. ...pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require) — used by the running app
      - key: DIRECT_DATABASE_URL
        sync: false # Set to Neon DIRECT connection string (no -pooler in hostname) — used by prisma migrate deploy during build to bypass pooler advisory locks
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set manually
      - key: CLOUDINARY_API_KEY
        sync: false # Set manually
      - key: CLOUDINARY_API_SECRET
        sync: false # Set manually
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false # Set manually
      - key: SMTP_PASS
        sync: false # Set manually
      - key: SMTP_FROM_NAME
        value: Sing Buri Adventist Center
      - key: SMTP_FROM_EMAIL
        value: noreply@singburi-adventist.org
      - key: SESSION_TIMEOUT_HOURS
        value: 24
      - key: ACCOUNT_LOCKOUT_DURATION_MINUTES
        value: 15
      - key: MAX_FAILED_LOGIN_ATTEMPTS
        value: 5
      - key: VAPID_PUBLIC_KEY
        sync: false # Set manually
      - key: VAPID_PRIVATE_KEY
        sync: false # Set manually
      - key: VAPID_SUBJECT
        value: mailto:admin@singburi-adventist.org
      - key: FRONTEND_URL
        value: https://www.singburisdacenter.org
